    - region "Twenty-five years among the islands’ maps":
        - heading "Twenty-five years among the islands’ maps" [level=2]
        - paragraph: Maps, prints, books and photographs of the East Indies, bought and sold in Singapore.
        - paragraph: Every original is offered with a certificate of authenticity from our curator, Dr David E. Parry, author of The Cartography of The East Indian Islands. Collectors come to us for a first map, and return for the rarer sheets.
        - heading "Dr David E. Parry" [level=3]
        - paragraph: The curator
        - paragraph: He wrote the reference work on East Indies cartography. Every piece we sell passes his desk first — the plate identified, the state established, the condition recorded in plain words rather than a code.
        - paragraph: His signed certificate travels with the object, and stays with it through every owner that follows.
    - heading "Recently placed" [level=2]
    - paragraph: A few of the works that have left the gallery. We mark a work sold — never to whom, never for how much.
    - list:
        - listitem:
