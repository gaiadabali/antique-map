    - text: The curator at work The curator
    - heading "Dr David E. Parry" [level=2]
    - paragraph: He wrote the reference work on East Indies cartography. Every piece we sell passes his desk first — the plate identified, the state established, the condition recorded in plain words rather than a code.
    - paragraph: His signed certificate travels with the object, and stays with it through every owner that follows.
    - text: Archive
    - heading "Recently placed" [level=2]
    - paragraph: Pieces that have found a home with collectors and institutions. We keep the record of where a piece went — never its price.
