- main:
    - heading "Do you have an antique of the East Indies?" [level=1]
    - paragraph: We buy antique maps, prints, books and photographs of the region, singly or as a collection. Message us, write, or use the form below.
    - paragraph: Our WhatsApp number and email address are being connected — please write to us from the Contact page soon.
    - link "Contact":
        - /url: /contact
    - paragraph: The form takes no photographs. Please send photos on WhatsApp or by email once we reply.
    - paragraph: We reply the same working day, Singapore time.
    - region "How selling works":
        - heading "How selling works" [level=2]
        - list:
            - listitem:
                - heading "Send photographs" [level=3]
                - paragraph: On WhatsApp or by email, with whatever you know of the piece.
            - listitem:
                - heading "The curator assesses it" [level=3]
                - paragraph: We look at what you send and tell you what we make of it.
            - listitem:
                - heading "We come back to you" [level=3]
                - paragraph: If we both want to go ahead, we settle the details with you.
    - region "Or write here":
        - heading "Or write here" [level=2]
        - text: Your name
        - textbox "Your name"
        - text: WhatsApp number
        - textbox "WhatsApp number"
        - paragraph: With the country code, for example +62 812 3456 7890.
        - text: Email address
        - textbox "Email address"
        - paragraph: Give a WhatsApp number or an email address — one is enough.
        - text: What do you have?
        - textbox "What do you have?"
        - checkbox "I agree that Indies Gallery may use these details to answer this enquiry, and keep them for up to 24 months after it is closed."
        - text: I agree that Indies Gallery may use these details to answer this enquiry, and keep them for up to 24 months after it is closed.
        - paragraph: Consent text gallery-contact-2026-10
        - button "Send message"
        - paragraph: A short security check keeps this form free of spam.
