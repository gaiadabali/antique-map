        - heading "About this product" [level=2]
        - paragraph: This autochrome portrait by Franklin Price Knott captures a nine-year-old Balinese dancer in elaborate traditional attire, crowned with an ornate gold-colored headdress and dressed in richly detailed ceremonial clothing. Taken in 1927 during the 73-year-old photographer’s ambitious 40,000-mile journey through Japan, China, the Philippines, Bali, and India for the National Geographic Society, the image is one of the earliest color photographs of Bali. Knott’s autochromes are regarded as milestones in the history of color photography. His Bali pictures helped introduce Western audiences to the island’s culture and beauty in the late 1920s, just before the height of the “Beautiful Indies” (Mooi Indië) promotional era of the 1930s, when shipping lines such as the Java-China-Japan Lijn marketed Bali as “the Isles of Romance and Beauty”.
