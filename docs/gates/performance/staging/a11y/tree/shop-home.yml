    - text: The workshop — press, paper, inks (placeholder) How we make them
    - heading "From an original in our hands to a print on your wall" [level=2]
    - text: 01/
    - paragraph: It starts with an original
    - paragraph: Not a file from the internet — an antique map or engraving we physically hold, the same ones our curator certifies.
    - text: 02/
    - paragraph: Restored by hand, scars kept
    - paragraph: We correct foxing, tears and fading. The marks that give a map its character stay — they are part of its story.
    - text: 03/
    - paragraph: Printed in our own workshop
    - paragraph: 300gsm cotton and archival pigment inks, printed in Bali. Not outsourced, not print-on-demand.
    - text: Trade & gifting
    - heading "For shops, hotels and companies" [level=2]
    - paragraph: More than 100 shops across Indonesia already stock Old East Indies. We also make custom gifts for hotels and corporate orders — Bali-themed, printed from the antique originals we hold.
    - link "See partnership options":
        - /url: /partnership
    - text: The originals
    - heading "Every print begins with a map we hold" [level=2]
    - paragraph: Those originals are examined and certified by our curator, and offered to collectors at Antique Maps Indonesia — our sister gallery.
    - link "See the originals":
        - /url: https://indies-gallery.gaiada.com/
    - text: An original, beside its print (placeholder)
