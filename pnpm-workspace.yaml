# The Indies Platform workspace. Owned by HAR (PARALLEL-TRACKS.md §1-2).
# A directory matched here without a package.json is skipped, so the app
# folders may hold planning files before 0.8 scaffolds them.
packages:
  - engine/apps/*
  - engine/packages/*
  - engine/tooling

# `pnpm add` writes exact versions: the stack is pinned (ARCHITECTURE.md §3).
savePrefix: ''

# Native build approvals. pnpm 11 refuses to run a dependency's install
# scripts unless it is listed here (strictDepBuilds is on by default), so a
# lane adding such a dependency asks HAR for an entry rather than debugging a
# failed install (PARALLEL-TRACKS.md §2). `false` records a deliberate refusal.
allowBuilds:
  sharp: true
  esbuild: true
  '@tailwindcss/oxide': true
  unrs-resolver: true

# Security overrides for `pnpm audit --prod --audit-level=high` (ci.yml `audit`).
# undici 7.29.0 arrives through payload; 7.29.1 fixes GHSA-rfgv-xxqx-mfg5 and
# GHSA-w293-vg96-wgc3 and is a patch release. Drop this once payload ships it.
# source-map-js 1.2.1 (GHSA-68fv-2mgg-jv7q)
# is a build-time transitive (postcss); the fix is a patch bump.
overrides:
  undici: 7.29.1
  source-map-js: 1.2.2

# Allowed advisories, each with its reason. Recheck by 2026-11-02 or on the next
# Payload upgrade, whichever comes first.
# - nodemailer 9.1.1 comes through @payloadcms/email-nodemailer; the fix is in
#   nodemailer 10.x, a major version the adapter does not support yet. Staging
#   mail goes to Mailpit (D13); production mail is decided under Q6.
# - braces 3.0.3 (GHSA-vfj7-8cjw-p6xm): the advisory names 3.0.4, which is not
#   published on npm. Reached only through sass>chokidar and vite/vitest at build
#   and dev time; nothing globs user input at runtime (security review 10.1, F-11).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-v53p-9fqp-m79j
    - GHSA-prgh-xp8r-p3m5
