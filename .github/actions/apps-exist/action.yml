# Phase 4 (App shells) has not landed: `engine/apps/{gallery,emporium}` are
# empty directories today (TASKS.md 2.3.a — "apps don't exist yet: make the
# build/Playwright/Lighthouse steps detect engine/apps/*/package.json absence
# and skip with a clear notice, so the pipeline is green now and real once
# phase 4 lands"). One place to make that call, so a step that skips today
# starts running for real the moment both `package.json`s exist — nothing in
# this file changes when that happens.
name: Detect whether both storefront apps exist
description: Sets `exists=true` only when engine/apps/gallery/package.json AND engine/apps/emporium/package.json are both present.
outputs:
  exists:
    description: "'true' once both apps are scaffolded, else 'false'"
    value: ${{ steps.check.outputs.exists }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      run: |
        if [ -f engine/apps/gallery/package.json ] && [ -f engine/apps/emporium/package.json ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::engine/apps/{gallery,emporium}/package.json not found yet (phase 4, App shells) — skipping app-dependent steps until then."
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
