name: CI

# Every push to main and every PR into it gets static checks and the
# production-dependency audit; e2e and Lighthouse are skipped on a docs-only
# change (`changes`). The secret scan (secrets.yml) runs on every push to any
# branch, CodeQL (codeql.yml) on main and its PRs. The deploy artifact and its
# release are a separate workflow (release.yml), triggered by a push to
# `production` (DEPLOYMENT.md §3) — this file never writes to Helios or GitHub
# Releases.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Docs-only pushes (docs/**, manual/**, *.md, TASKS.md, .claude/**) skip e2e
  # and Lighthouse. `static` still runs — it is fast and `tasks:lint` reads
  # TASKS.md itself, so a docs-only push is exactly the case it must not skip.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!manual/**'
              - '!.claude/**'
              - '!TASKS.md'
              - '!**/*.md'

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node

      - name: File size (300-line rule)
        run: pnpm check:filesize
      - name: Generated files are current
        run: pnpm check:generated
      - name: TASKS.md structure
        run: pnpm tasks:lint
      - name: TASKS.md progress table is current
        run: pnpm tasks:check

      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      # Guard only: Helios fetches .gaiadeploy.yml itself from `production` at
      # the pushed SHA, so this catches a bad manifest on the PR that broke
      # it, not at deploy time. "Never commit TBD" (DEPLOYMENT.md §3) — a
      # committed placeholder had another repo's poller failing every 60s for
      # weeks. One app, one release subdir: exactly one entry, unpacking `web`.
      - name: Deploy manifest exists, parses, has no TBD and one entry for web/
        run: |
          test -f .gaiadeploy.yml || { echo "::error::.gaiadeploy.yml is missing"; exit 1; }
          if grep -qE '\bTBD\b' .gaiadeploy.yml; then
            echo "::error::.gaiadeploy.yml still contains TBD"
            exit 1
          fi
          python3 - <<'PY'
          import sys, yaml
          entries = yaml.safe_load(open('.gaiadeploy.yml'))['production']
          if len(entries) != 1 or entries[0].get('subdir') != 'web':
              print(f"::error::.gaiadeploy.yml needs exactly one production entry with subdir web, found {entries}")
              sys.exit(1)
          PY

  # High and critical advisories in what ships fail (SECURITY.md D2, CONVENTIONS.md §15). It reads
  # the lockfile against the registry's advisories, so it needs no install.
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: 'false'
      - name: pnpm audit --prod --audit-level=high
        run: pnpm audit --prod --audit-level=high

  e2e:
    name: End-to-end
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yml

  lighthouse:
    name: Lighthouse
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Lighthouse audits both sites' home pages (lighthouserc.web.json) on the release's own tree,
    # ONE server started as a host runs it (.github/scripts/start-server.sh) and asked for by each
    # hostname, gallery.localhost and shop.localhost, on one port, each host its own site.
    # LOCAL_PRODUCTION_BUILD=1: a production build at local hosts is judged production without
    # it (DEPLOYMENT.md §7); start-server.sh sets it on the server.
    env:
      LOCAL_PRODUCTION_BUILD: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      DB_SUFFIX: ci
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node

      - name: Postgres client
        run: sudo apt-get install -y postgresql-client

      - name: db:fresh — the one database (created and migrated)
        run: pnpm db:fresh --suffix "$DB_SUFFIX"

      # No DATABASE_URL or PAYLOAD_SECRET, and pg's PGHOST fallback at a refusing port
      # (CONVENTIONS.md §12): the job's PGHOST/PGPORT above point at the real Postgres.
      - name: Build the app (no database env)
        run: env -u DATABASE_URL -u PAYLOAD_SECRET PGHOST=127.0.0.1 PGPORT=1 pnpm build

      - name: Assemble the release tree
        run: bash .github/scripts/assemble-artifact.sh "$RUNNER_TEMP/artifact"

      - name: Map gallery.localhost and shop.localhost to loopback
        run: echo '127.0.0.1 gallery.localhost shop.localhost' | sudo tee -a /etc/hosts

      - name: Start the server (both hosts, one port)
        run: >-
          bash .github/scripts/start-server.sh web "$RUNNER_TEMP/artifact/web" 4200
          "indies_$DB_SUFFIX"

      - name: Lighthouse budgets (both hosts)
        run: pnpm lhci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
          include-hidden-files: true
