name: CI

# Every push to main and every PR into it gets the static checks and the production-dependency
# audit; the unit tests, the real-database tests, e2e and Lighthouse are skipped on a docs-only
# change (`changes`). The secret scan (secrets.yml) runs on every push to any branch, CodeQL
# (codeql.yml) on main and its PRs. The deploy artifact and its release are a separate workflow
# (release.yml), triggered by a push to `production` (DEPLOYMENT.md §3) — this file never writes
# to Helios or GitHub Releases.
#
# Wall clock is the longest job, not the sum: the jobs run side by side, and inside a job the
# independent steps run together (.github/scripts/run-parallel.sh). The e2e job is the long pole;
# see e2e.yml for what it caches.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Docs-only pushes (docs/**, manual/**, *.md, TASKS.md, .claude/**) skip every test job.
  # `static` still runs — it is fast and `tasks:lint` reads TASKS.md itself, so a docs-only push is
  # exactly the case it must not skip.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!manual/**'
              - '!.claude/**'
              - '!TASKS.md'
              - '!**/*.md'

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node

      # High and critical advisories in what ships fail (SECURITY.md D2, CONVENTIONS.md §15). It
      # reads the lockfile against the registry's advisories.
      - name: pnpm audit --prod --audit-level=high
        run: pnpm audit --prod --audit-level=high

      - name: TASKS.md structure and progress table
        run: pnpm tasks:lint && pnpm tasks:check

      # Alone, before the others: it regenerates importMap.js in place and puts it back, and the
      # type check reads that file.
      - name: Generated files are current
        run: pnpm check:generated

      # Read-only checks over the same tree, side by side (each prints in its own group).
      - name: File size, formatting, lint and types (in parallel)
        run: >-
          bash .github/scripts/run-parallel.sh
          'File size (300-line rule)' 'pnpm check:filesize'
          'Formatting' 'pnpm format:check'
          'Lint' 'pnpm lint'
          'Types' 'pnpm typecheck'

      # Guard only: Helios fetches .gaiadeploy.yml itself from `production` at the pushed SHA, so
      # this catches a bad manifest on the PR that broke it, not at deploy time. "Never commit TBD"
      # (DEPLOYMENT.md §3) — a committed placeholder had another repo's poller failing every 60s
      # for weeks. One app, one release subdir: exactly one entry, unpacking `web`.
      - name: Deploy manifest exists, parses, has no TBD and one entry for web/
        run: |
          test -f .gaiadeploy.yml || { echo "::error::.gaiadeploy.yml is missing"; exit 1; }
          if grep -qE '\bTBD\b' .gaiadeploy.yml; then
            echo "::error::.gaiadeploy.yml still contains TBD"
            exit 1
          fi
          python3 - <<'PY'
          import sys, yaml
          entries = yaml.safe_load(open('.gaiadeploy.yml'))['production']
          if len(entries) != 1 or entries[0].get('subdir') != 'web':
              print(f"::error::.gaiadeploy.yml needs exactly one production entry with subdir web, found {entries}")
              sys.exit(1)
          PY

  # The unit tests import no database test (`*.db.test.*` are their own run, `db-tests` below).
  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node
      - name: Unit tests
        run: pnpm test
      - name: AI eval (recorded set)
        run: pnpm ai:eval

  # The CMS's real-database tests (`*.db.test.*`). Each test file gets its own database, cloned
  # from one migrated template, and drops it after. CMS_TEST_POSTGRES_URL names the maintenance
  # database; the role must be able to CREATE DATABASE. Without the variable they skip, so this job
  # is what runs them.
  db-tests:
    name: Database tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CMS_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node
      - name: CMS real-database tests
        run: pnpm test:db

  e2e:
    name: End-to-end
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yml

  lighthouse:
    name: Lighthouse
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Lighthouse audits both sites' home pages (lighthouserc.web.json) on the release's own tree,
    # ONE server started as a host runs it (.github/scripts/start-server.sh) and asked for by each
    # hostname, gallery.localhost and shop.localhost, on one port, each host its own site.
    # LOCAL_PRODUCTION_BUILD=1: a production build at local hosts is judged production without
    # it (DEPLOYMENT.md §7); start-server.sh sets it on the server.
    env:
      LOCAL_PRODUCTION_BUILD: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      DB_SUFFIX: ci
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node

      # Turbopack's build cache, warm from the e2e job's last save on main (e2e.yml). Read only here.
      - name: Restore the Next build cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: engine/apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The runner image ships psql; install it only if a future image drops it.
      - name: Postgres client
        run: command -v psql || sudo apt-get install -y postgresql-client

      # The database (4 s) and the build, which never reads one (CONVENTIONS.md §12: no
      # DATABASE_URL or PAYLOAD_SECRET, and pg's PGHOST fallback at a port that refuses every
      # connection), side by side.
      - name: Database (created and migrated) and the build (no database env), in parallel
        run: >-
          bash .github/scripts/run-parallel.sh
          'db:fresh' 'pnpm db:fresh --suffix "$DB_SUFFIX"'
          'Build' 'env -u DATABASE_URL -u PAYLOAD_SECRET PGHOST=127.0.0.1 PGPORT=1 pnpm build'

      - name: Assemble the release tree
        run: bash .github/scripts/assemble-artifact.sh "$RUNNER_TEMP/artifact"

      - name: Map gallery.localhost and shop.localhost to loopback
        run: echo '127.0.0.1 gallery.localhost shop.localhost' | sudo tee -a /etc/hosts

      # The bag cookie's signing secret: without it every page that reads the bag logs an error
      # (docs/gates/phase-6-checks.md Finding 3). One random value per job, masked.
      - name: BAG_COOKIE_KEY for the server
        run: |
          bag="$(openssl rand -base64 32)"
          echo "::add-mask::$bag"
          echo "BAG_COOKIE_KEY=$bag" >> "$GITHUB_ENV"

      - name: Start the server (both hosts, one port)
        run: >-
          bash .github/scripts/start-server.sh web "$RUNNER_TEMP/artifact/web" 4200
          "indies_$DB_SUFFIX" "BAG_COOKIE_KEY=$BAG_COOKIE_KEY"

      - name: Lighthouse budgets (both hosts)
        run: pnpm lhci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
          include-hidden-files: true
