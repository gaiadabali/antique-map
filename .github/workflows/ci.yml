name: CI

# Every push to main and every PR into it gets static checks; e2e and
# Lighthouse are skipped on a docs-only change (`changes`, TASKS.md 2.3.a).
# The deploy artifact and its release are a separate workflow (release.yml),
# triggered by a push to `production` (DEPLOYMENT.md §3) — this file never
# writes to Helios or GitHub Releases.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Docs-only pushes (docs/**, manual/**, *.md, TASKS.md, .claude/**) skip e2e
  # and Lighthouse. `static` still runs — it is fast and `tasks:lint` reads
  # TASKS.md itself, so a docs-only push is exactly the case it must not skip.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!manual/**'
              - '!.claude/**'
              - '!TASKS.md'
              - '!**/*.md'

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node

      - name: File size (300-line rule)
        run: pnpm check:filesize
      - name: Brand-literal lint
        run: pnpm lint:brand-literals
      # No 'use client' module under engine/ reaches zod, the config schema, node:*, Payload or
      # @engine/cms (engine/tooling/client-safe, TASKS.md 4.2) — named here as `pnpm verify` runs it.
      - name: Client-safe gate
        run: pnpm check:client-safe
      - name: Route parity
        run: pnpm check:routes
      - name: Generated files are current
        run: pnpm check:generated
      - name: TASKS.md structure
        run: pnpm tasks:lint

      # validateBrandConfigs() is 3.1's (engine/packages/config/src/validate.ts)
      # — not written yet. Explicit, named skip rather than a silent gap, so
      # this step starts failing loudly the day the script exists but this
      # line was forgotten.
      - name: Brand config validation (TODO 3.1 — validateBrandConfigs())
        run: |
          if pnpm run 2>/dev/null | grep -q 'validate:brand-configs'; then
            pnpm run validate:brand-configs
          else
            echo "::notice::validateBrandConfigs() is not wired up yet (TASKS.md 3.1.a) — skipping explicitly, not silently."
          fi

      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      # Guard only: Helios fetches .gaiadeploy.yml itself from `production` at
      # the pushed SHA, so this catches a bad manifest on the PR that broke
      # it, not at deploy time. "Never commit TBD" (DEPLOYMENT.md §3) — a
      # committed placeholder had another repo's poller failing every 60s for
      # weeks.
      - name: Deploy manifest exists, parses, and has no TBD
        run: |
          test -f .gaiadeploy.yml || { echo "::error::.gaiadeploy.yml is missing"; exit 1; }
          if grep -qE '\bTBD\b' .gaiadeploy.yml; then
            echo "::error::.gaiadeploy.yml still contains TBD"
            exit 1
          fi
          python3 -c "import yaml; yaml.safe_load(open('.gaiadeploy.yml'))"

  e2e:
    name: End-to-end
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yml

  lighthouse:
    name: Lighthouse
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Lighthouse audits the routes that exist today (TASKS.md 4.4.c) on the release's own tree,
    # started as a host runs it (.github/scripts/start-server.sh): the gallery's home and the
    # spike's item page (SPIKE_ROUTES=1, local hosts only) for Indies Gallery on :4200, the
    # emporium's home for Old East Indies on :4201 — lighthouserc.{gallery,emporium}.json.
    # LOCAL_PRODUCTION_BUILD=1: a production build at a loopback SITE_URL is judged production
    # without it (TASKS.md 4.2.d, 3.5's report); start-server.sh sets it on each server.
    env:
      LOCAL_PRODUCTION_BUILD: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      DB_SUFFIX: ci
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node

      - name: Postgres client
        run: sudo apt-get install -y postgresql-client

      - name: db:fresh — ig and oei (created and migrated)
        run: |
          pnpm db:fresh --brand indies-gallery --suffix "$DB_SUFFIX"
          pnpm db:fresh --brand old-east-indies --suffix "$DB_SUFFIX"

      - name: Build both apps (no database env)
        run: env -u DATABASE_URL -u PAYLOAD_SECRET pnpm build

      # Next's own bundle as the gate (TASKS.md 5.5.e, ARCHITECTURE.md §15): no engine route's
      # synchronously loaded chunks hold engine/packages/cms or Payload; a lazy import() may.
      - name: Engine routes bundle no Payload (both apps)
        run: node engine/tooling/bundle-scan/cli.mjs

      - name: Assemble the release tree
        run: bash .github/scripts/assemble-artifact.sh "$RUNNER_TEMP/artifact"

      - name: Start the servers (ig with the spike's routes, oei)
        run: |
          set -euo pipefail
          art="$RUNNER_TEMP/artifact"
          bash .github/scripts/start-server.sh ig "$art/indies-gallery" gallery 4200 "indies_gallery_$DB_SUFFIX" indies-gallery "$art/indies-gallery/brand" SPIKE_ROUTES=1
          bash .github/scripts/start-server.sh oei "$art/old-east-indies" emporium 4201 "old_east_indies_$DB_SUFFIX" old-east-indies "$art/old-east-indies/brand"

      - name: Lighthouse budgets (both apps)
        run: pnpm lhci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
          include-hidden-files: true
