name: Secret scan

# A gitleaks scan of the whole history on every push, to any branch, and on every PR
# (SECURITY.md K3, CONVENTIONS.md §15): a secret is caught on the branch that adds it, before
# review, not after a merge. The binary is the release's own, checked against its published
# SHA-256 — no third-party action, so no licence key and nothing unpinned. Reviewed false
# positives (test vectors and fixtures) are listed by fingerprint in .github/.gitleaksignore.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the whole history: a secret removed in a later commit is still leaked

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # --redact: a finding's value never reaches the log.
      - name: Scan the history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose
          --gitleaks-ignore-path .github/.gitleaksignore .
