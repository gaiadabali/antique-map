name: Shop e2e / Lighthouse (reusable)

# One job that serves the shop app's ONE build (shop.yml's `build` artifact) on its seeded database
# and then runs either the shop's e2e (`pnpm test:e2e:shop`) or Lighthouse
# (lighthouserc.shop.json) against it — called twice from shop.yml, the two side by side. Nothing
# here builds.
#
# The server is the assembled tree a host runs (start-server.sh, SERVER_APP=shop): one host,
# shop.localhost, the one-app environment (SITE_HOSTS), its own database `indies_shop_ci` restored
# from the snapshot `build` made or found. LOCAL_PRODUCTION_BUILD=1: a production build at local
# hosts is judged production without it (DEPLOYMENT.md §7).
#
# The gallery is not started: `GALLERY_ORIGIN` names a port nothing listens on, so the e2e runs
# the originals spec in its "gallery down" state (E2E_GALLERY=down: the product page whole, no
# link). The "gallery up" state needs the gallery's own app and database, and is the gallery app's
# CI's to add (phase 25).
on:
  workflow_call:
    inputs:
      snapshot:
        description: The seeded database snapshot's cache key (shop-e2e-db.sh key), from `build`.
        required: true
        type: string
      lighthouse:
        description: Run Lighthouse instead of the e2e suite.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  serve:
    name: ${{ inputs.lighthouse && 'Lighthouse budgets' || 'Playwright' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOCAL_PRODUCTION_BUILD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      DB_SUFFIX: ci
      E2E_PORT: '4300'
      E2E_GALLERY: down
      GALLERY_PORT: '4880'
      SNAPSHOT_DIR: ${{ github.workspace }}/.shop-e2e-db
    services:
      # The order mail the purchase sends (SMTP on 1025); nothing reads it back yet.
      mailpit:
        image: ghcr.io/axllent/mailpit:v1.21
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-postgres
      - uses: ./.github/actions/setup-pnpm-node

      - name: Restore the seeded database snapshot
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .shop-e2e-db
          key: ${{ inputs.snapshot }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shop-build
          path: ${{ runner.temp }}

      - name: Playwright's version
        if: ${{ !inputs.lighthouse }}
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright's Chromium
        if: ${{ !inputs.lighthouse }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Database, the build's tree and browsers (in parallel)
        env:
          LIGHTHOUSE: ${{ inputs.lighthouse }}
        run: |
          set -- 'Database (snapshot)' \
            'bash .github/scripts/shop-e2e-db.sh restore "indies_shop_$DB_SUFFIX" "$SNAPSHOT_DIR"' \
            'The build (artifact)' \
            'mkdir -p "$RUNNER_TEMP/artifact" && tar -C "$RUNNER_TEMP/artifact" -xf "$RUNNER_TEMP/shop-build.tar"'
          if [ "$LIGHTHOUSE" != 'true' ]; then
            set -- "$@" 'Playwright browsers' 'bash .github/scripts/playwright-browsers.sh'
          fi
          bash .github/scripts/run-parallel.sh "$@"

      # Chromium resolves *.localhost to loopback by itself; Node's resolver — the `request`
      # fixture's, and the shop server's own fetch of the gallery — is mapped here.
      - name: Map shop.localhost and gallery.localhost to loopback
        run: echo '127.0.0.1 shop.localhost www.shop.localhost gallery.localhost' | sudo tee -a /etc/hosts

      # Per job, random, masked: the bag cookie's key, the order links' key (shared with the
      # specs), the revalidate and cron bearers.
      - name: The server's keys
        run: |
          for name in BAG_COOKIE_KEY ORDER_LINK_KEY; do
            value="$(openssl rand -base64 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          for name in REVALIDATE_SECRET CRON_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start the shop (its own host, its own database)
        env:
          SERVER_APP: shop
          SERVER_MEDIA_DIR: ${{ github.workspace }}/engine/packages/cms-shop/media
        run: >-
          bash .github/scripts/start-server.sh shop "$RUNNER_TEMP/artifact/shop" "$E2E_PORT"
          "indies_shop_$DB_SUFFIX" "ORDER_LINK_KEY=$ORDER_LINK_KEY" "BAG_COOKIE_KEY=$BAG_COOKIE_KEY"
          "REVALIDATE_SECRET=$REVALIDATE_SECRET" "CRON_SECRET=$CRON_SECRET"
          "GALLERY_ORIGIN=http://gallery.localhost:$GALLERY_PORT"
          SMTP_HOST=127.0.0.1 SMTP_PORT=1025 SMTP_FROM_ADDRESS=no-reply@example.test
          MIDTRANS_MODE=simulate
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA

      # playwright.shop.config.ts: the purchase to tracking, the admin's roles and store scoping,
      # the partner's sign-in, the host rules, and the originals spec with the gallery down.
      - name: Playwright (the shop app)
        if: ${{ !inputs.lighthouse }}
        run: pnpm test:e2e:shop

      - name: Lighthouse budgets (lighthouserc.shop.json)
        if: ${{ inputs.lighthouse }}
        run: pnpm exec lhci autorun --config=./lighthouserc.shop.json

      - name: Server log
        if: always()
        run: |
          for log in "$RUNNER_TEMP"/servers/*.log; do
            [ -e "$log" ] || continue
            echo "::group::$(basename "$log")"
            cat "$log"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.lighthouse && always() }}
        with:
          name: lighthouse-shop
          path: .lighthouseci/
          retention-days: 7
          include-hidden-files: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.lighthouse && failure() }}
        with:
          name: playwright-report-shop
          path: |
            playwright-report/
            ${{ runner.temp }}/servers/*.log
          retention-days: 7
