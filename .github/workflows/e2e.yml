name: E2E (reusable)

# Split out of ci.yml to keep both files under the 300-line rule
# (CONVENTIONS.md §2, applied to workflows). Called only from ci.yml's `e2e`
# job, never triggered directly.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A bare Postgres 18 service container (no docker-compose stack behind
    # it) — the image's own docker-entrypoint-initdb.d never runs here
    # (GitHub Actions `services:` supports no volume mounts), so the
    # `unaccent`/`pg_trgm` extensions the one e2e database needs are created
    # explicitly by `db:fresh`'s `createDatabase()`
    # (engine/tooling/db/psql.mjs), not by docker-compose.dev.yml's init
    # script.
    #
    # PGHOST switches `psql.mjs` to the direct transport
    # (engine/tooling/db/transport.mjs) instead of `docker compose exec` —
    # there is no compose project here for `exec` to reach.
    #
    # DB_SUFFIX names the one database (`indies_gallery_ci`, TASKS.md 2.1.c):
    # one app, one database. Until 2.2 the process serves one brand (BRAND),
    # and `db:fresh` still names a database after it.
    #
    # LOCAL_PRODUCTION_BUILD=1: this job serves the production build on a
    # loopback port for Playwright, which bootCheck() judges local only with
    # it (DEPLOYMENT.md §8) — without it it is judged production and refuses
    # to start on sandbox keys and draft configs. Only CI and a worktree's
    # .env.local set it; never a host. start-server.sh sets it on the server
    # again, from an empty environment.
    env:
      LOCAL_PRODUCTION_BUILD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      DB_SUFFIX: ci
      E2E_BRAND: indies-gallery
      E2E_PORT: '4200'
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node

      # A client matching the server's major version (18): the distro repo on
      # ubuntu-latest ships 16; PGDG's own repo is the documented way to get 18.
      - name: Install postgresql-client-18 (PGDG)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      # The one e2e database: created, then migrated with the committed
      # migration set under the advisory lock (`pnpm --filter @engine/cms
      # migrate`, TASKS.md 3.5.c), with a DATABASE_URL the hook builds from
      # this job's PGHOST/PGPORT/POSTGRES_USER/PGPASSWORD and a dev
      # PAYLOAD_SECRET of its own. A failed migration fails the step.
      - name: db:fresh — the one e2e database (created and migrated)
        run: pnpm db:fresh --brand "$E2E_BRAND" --suffix "$DB_SUFFIX"

      - name: unaccent and pg_trgm in the e2e database
        run: |
          db="${E2E_BRAND//-/_}_$DB_SUFFIX"
          found=$(psql -U "$POSTGRES_USER" -d "$db" -tAc "select string_agg(extname, ',' order by extname) from pg_extension where extname in ('pg_trgm','unaccent')")
          echo "$db: $found"
          [ "$found" = "pg_trgm,unaccent" ] || { echo "::error::$db lacks unaccent or pg_trgm"; exit 1; }

      # The CMS's real-database tests (`*.db.test.ts`): the unit job has no
      # Postgres, so they run here, where the service is. Each makes its own
      # database on the server CMS_TEST_POSTGRES_URL names (the maintenance
      # database; the role must be able to CREATE DATABASE), migrates it and
      # drops it WITH (FORCE). Without the variable they skip, so this step is
      # what runs them.
      - name: CMS real-database tests
        env:
          CMS_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm exec vitest run --project packages .db.test

      # The build touches no database (CONVENTIONS.md §12): no DATABASE_URL or
      # PAYLOAD_SECRET, and PGHOST/PGPORT — which this job sets for the steps
      # above, and which `pg` falls back to — pointed at a port that refuses
      # every connection, so a build that tried to connect fails here.
      - name: Build the app (no database env — like the deploy artifact)
        run: env -u DATABASE_URL -u PAYLOAD_SECRET PGHOST=127.0.0.1 PGPORT=1 pnpm build

      # The release's own tree (release.yml runs the same script), so every push to main
      # proves the artifact a `production` push would publish boots and serves.
      - name: Assemble the release tree
        run: bash .github/scripts/assemble-artifact.sh "$RUNNER_TEMP/artifact"

      # Chromium resolves *.localhost to loopback by itself; Node's resolver, which
      # Playwright's `request` fixture uses, is mapped here so it never depends on the image.
      - name: Map gallery.localhost and shop.localhost to loopback
        run: echo '127.0.0.1 gallery.localhost shop.localhost' | sudo tee -a /etc/hosts

      # ONE server on one port answers both hostnames (start-server.sh: `node server.js` from an
      # empty environment, HOSTNAME=0.0.0.0, a PAYLOAD_SECRET and a `ci:` LINK_TOKEN_KEYS ring
      # generated for it). Until 2.2 it serves BRAND on both hosts.
      - name: Start the server (both hosts, one port)
        run: >-
          bash .github/scripts/start-server.sh web "$RUNNER_TEMP/artifact/web" "$E2E_PORT"
          "${E2E_BRAND//-/_}_$DB_SUFFIX" "$E2E_BRAND"

      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts: the smoke on {gallery, shop} × {390, 1280 px}; the status spec on the
      # gallery host and its @any-app cases on the shop host; axe on each host at both widths. The
      # proxy sets a missing User-Agent since 5.3, so E2E_EXPECT_UA_FIX=1 runs the no-User-Agent
      # cases. E2E_EXPECT_NOT_FOUND_BODY stays unset until 22.4.e (a 404's non-empty <main>),
      # E2E_EXPECT_CSP until 41.1.a: their cases are `fixme` until then.
      - name: Playwright (smoke, status and axe on both hosts)
        env:
          E2E_EXPECT_UA_FIX: '1'
        run: pnpm test:e2e

      - name: Server log
        if: always()
        run: |
          for log in "$RUNNER_TEMP"/servers/*.log; do
            [ -e "$log" ] || continue
            echo "::group::$(basename "$log")"
            cat "$log"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            ${{ runner.temp }}/servers/*.log
          retention-days: 7
