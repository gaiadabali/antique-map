name: E2E (reusable)

# Split out of ci.yml to keep both files under the 300-line rule
# (CONVENTIONS.md §2, applied to workflows). Called only from ci.yml's `e2e`
# job, never triggered directly.
#
# This is CI's long pole, so it is built for wall clock:
# - the seeded database is a cached snapshot (.github/scripts/e2e-db.sh), keyed on every file that
#   decides what the seed writes; a hit restores it in seconds, a miss seeds it and saves one;
# - the build, the database and Playwright's browser install run side by side
#   (.github/scripts/run-parallel.sh): the build reads no database;
# - Turbopack's build cache (`.next/cache`) is restored from the last main run, and saved by main
#   pushes alone, so PRs never churn the repository's cache;
# - Playwright runs on every core (E2E_WORKERS).
# The CMS's real-database tests are ci.yml's own `db-tests` job, beside this one.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A bare Postgres 18 service container (no docker-compose stack behind it) — the image's own
    # docker-entrypoint-initdb.d never runs here (GitHub Actions `services:` supports no volume
    # mounts), so the `unaccent`/`pg_trgm` extensions the one e2e database needs are created
    # explicitly by `db:fresh`'s `createDatabase()` (engine/tooling/db/psql.mjs), not by
    # docker-compose.dev.yml's init script; a restored snapshot carries them.
    #
    # PGHOST switches `psql.mjs` to the direct transport (engine/tooling/db/transport.mjs) instead
    # of `docker compose exec` — there is no compose project here for `exec` to reach. Only SQL
    # goes through the runner's own psql, so its major version need not match the server's.
    #
    # DB_SUFFIX names the one database (`indies_ci`): one app, one database, both sites picked by
    # each request's Host (TASKS.md 2.2).
    #
    # LOCAL_PRODUCTION_BUILD=1: this job serves the production build on a loopback port for
    # Playwright, which bootCheck() judges local only with it (DEPLOYMENT.md §7) — without it it
    # is judged production and refuses to start on sandbox keys. Only CI and a worktree's
    # .env.local set it; never a host. start-server.sh sets it on the server again, from an empty
    # environment.
    env:
      LOCAL_PRODUCTION_BUILD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      DB_SUFFIX: ci
      E2E_PORT: '4200'
      # Playwright workers: the runner's 4 cores (playwright.config.ts reads it).
      E2E_WORKERS: '4'
      # The specs' own SQL reads (tests/e2e/admin/local.mjs) go through psql here, not docker exec.
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/indies_ci
      MAILPIT_URL: http://127.0.0.1:8025
      # Where the specs' seed scripts post their cache tags (the server below, same secret).
      REVALIDATE_ORIGIN: http://127.0.0.1:4200
      SNAPSHOT_DIR: ${{ github.workspace }}/.e2e-db
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The mail the order and enquiry flows send, read back by the specs through its API
      # (MAILPIT_URL): SMTP on 1025 for the server, the HTTP API on 8025 for Playwright.
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-pnpm-node

      # The seeded database. The key covers everything the seed's writes depend on (e2e-db.sh key:
      # the CMS and the packages it imports, the db tooling, the shop publish script, the lockfile,
      # the snapshot script and the Postgres image); anything else changing cannot change them.
      - name: The seeded database's cache key
        id: snapshot-key
        run: echo "key=$(bash .github/scripts/e2e-db.sh key)" >> "$GITHUB_OUTPUT"

      - name: Restore the seeded database snapshot
        id: snapshot
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .e2e-db
          key: ${{ steps.snapshot-key.outputs.key }}

      - name: Restore the Next build cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: engine/apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Playwright's Chromium, cached on Playwright's version (installed in the parallel step below
      # on a miss; .github/scripts/playwright-browsers.sh).
      - name: Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright's Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The runner image ships psql (SQL only: see the job's note); install it only if a future
      # image drops it.
      - name: Postgres client
        run: command -v psql || sudo apt-get install -y postgresql-client

      # One key for the job, shared by the server and by the specs' own seed scripts (placeOrder
      # seals the order links with it): 32 random bytes, base64 (link-key.ts).
      - name: ORDER_LINK_KEY for the server and the specs
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "ORDER_LINK_KEY=$key" >> "$GITHUB_ENV"
          # The bag cookie's signing secret (32+ chars; every page that reads the bag 500s
          # without it: docs/gates/phase-6-checks.md Finding 3).
          bag="$(openssl rand -base64 32)"
          echo "::add-mask::$bag"
          echo "BAG_COOKIE_KEY=$bag" >> "$GITHUB_ENV"
          rev="$(openssl rand -hex 32)"
          echo "::add-mask::$rev"
          echo "REVALIDATE_SECRET=$rev" >> "$GITHUB_ENV"

      # Three independent things at once; the step takes as long as the slowest.
      # - The database: the snapshot restored, or on a miss created, migrated (the committed set,
      #   under the advisory lock: `pnpm --filter @engine/cms migrate`, TASKS.md 3.5.c) and seeded —
      #   the vocabulary and the 50-work gallery sample published; the shop's 80 mock products as
      #   drafts, which a picture-less product cannot publish, so `publish-shop-products.ts` gives
      #   each the gallery sample's first image and publishes it — then snapshotted before any spec
      #   runs. DB_SUFFIX and PG* name the database.
      # - The build, which touches no database (CONVENTIONS.md §12): no DATABASE_URL or
      #   PAYLOAD_SECRET, and PGHOST/PGPORT — which `pg` falls back to — pointed at a port that
      #   refuses every connection, so a build that tried to connect fails here.
      # - Playwright's Chromium and its system libraries.
      - name: Database, build and browsers (in parallel)
        env:
          SNAPSHOT_HIT: ${{ steps.snapshot.outputs.cache-hit }}
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash .github/scripts/run-parallel.sh \
            'Database (snapshot, or seed and snapshot)' \
            'bash .github/scripts/e2e-db.sh prepare "$PG_CONTAINER" "indies_$DB_SUFFIX" "$SNAPSHOT_DIR" "$SNAPSHOT_HIT"' \
            'Build (no database env)' \
            'env -u DATABASE_URL -u PAYLOAD_SECRET PGHOST=127.0.0.1 PGPORT=1 pnpm build' \
            'Playwright browsers' \
            'bash .github/scripts/playwright-browsers.sh'

      - name: Save the seeded database snapshot
        if: steps.snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .e2e-db
          key: ${{ steps.snapshot-key.outputs.key }}

      # Main pushes alone keep Turbopack's cache warm (about 365 MB); a PR reads it, never writes.
      - name: Save the Next build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: engine/apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: unaccent and pg_trgm in the e2e database
        run: |
          db="indies_$DB_SUFFIX"
          found=$(psql -U "$POSTGRES_USER" -d "$db" -tAc "select string_agg(extname, ',' order by extname) from pg_extension where extname in ('pg_trgm','unaccent')")
          echo "$db: $found"
          [ "$found" = "pg_trgm,unaccent" ] || { echo "::error::$db lacks unaccent or pg_trgm"; exit 1; }

      # The release's own tree (release.yml runs the same script), so every push to main
      # proves the artifact a `production` push would publish boots and serves.
      - name: Assemble the release tree
        run: bash .github/scripts/assemble-artifact.sh "$RUNNER_TEMP/artifact"

      # Chromium resolves *.localhost to loopback by itself; Node's resolver, which
      # Playwright's `request` fixture uses, is mapped here so it never depends on the image.
      - name: Map gallery.localhost and shop.localhost to loopback
        run: echo '127.0.0.1 gallery.localhost shop.localhost' | sudo tee -a /etc/hosts

      # ONE server on one port answers both hostnames (start-server.sh: `node server.js` from an
      # empty environment, HOSTNAME=0.0.0.0, a PAYLOAD_SECRET and a `ci:` LINK_TOKEN_KEYS ring
      # generated for it), each host its own site.
      - name: Start the server (both hosts, one port)
        run: >-
          bash .github/scripts/start-server.sh web "$RUNNER_TEMP/artifact/web" "$E2E_PORT"
          "indies_$DB_SUFFIX" "ORDER_LINK_KEY=$ORDER_LINK_KEY" "BAG_COOKIE_KEY=$BAG_COOKIE_KEY"
          "REVALIDATE_SECRET=$REVALIDATE_SECRET"
          SMTP_HOST=127.0.0.1 SMTP_PORT=1025 SMTP_FROM_ADDRESS=no-reply@example.test
          MIDTRANS_MODE=simulate CRON_SECRET=dev-only-not-a-secret
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA

      # playwright.config.ts: the smoke on {gallery, shop} × {390, 1280 px}; the status spec and
      # axe on each host; the host-trust spec (unknown host, spoofed X-Forwarded-Host, the admin
      # host) once. Chromium and the `request` fixture both reach *.localhost on loopback. The
      # proxy sets a missing User-Agent since 5.3, so E2E_EXPECT_UA_FIX=1 runs the no-User-Agent
      # cases. E2E_EXPECT_NOT_FOUND_BODY stays unset until 22.4.e (a 404's non-empty <main>),
      # E2E_EXPECT_CSP until 41.1.a: their cases are `fixme` until then.
      - name: Playwright (smoke, status, hosts and axe on both hosts)
        env:
          E2E_EXPECT_UA_FIX: '1'
        run: pnpm test:e2e

      - name: Server log
        if: always()
        run: |
          for log in "$RUNNER_TEMP"/servers/*.log; do
            [ -e "$log" ] || continue
            echo "::group::$(basename "$log")"
            cat "$log"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            ${{ runner.temp }}/servers/*.log
          retention-days: 7
