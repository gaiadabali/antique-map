name: Release

# The other half of DEPLOYMENT.md §3's release flow: ci.yml proves main; a
# merge to `production` (never pushed to directly — CONVENTIONS.md §9) builds
# the standalone artifact and publishes it as a `deploy/production-*` GitHub
# release. `gaiada-poll` on Helios (60 s) picks the release up, verifies the
# `.sha256`, and unpacks per `.gaiadeploy.yml`'s `subdir` — nothing here
# touches Helios directly (DEPLOYMENT.md §9: Helios writes need the owner's
# go-ahead every time).
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  # One release at a time, never cancelled mid-publish — two pushes finishing
  # out of order must not have the poller pick up the older one.
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  artifact:
    name: Build the deploy artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      name: ${{ steps.pack.outputs.name }}
    # The release smoke boots the one subdir, web/, from the packed tarball, which needs a migrated
    # database (the admin initialises Payload). The build itself never sees it: it runs with
    # DATABASE_URL and PAYLOAD_SECRET unset and pg's PGHOST fallback at a port that refuses every
    # connection (CONVENTIONS.md §12).
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      DB_SUFFIX: release
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # pnpm from packageManager through pnpm/action-setup, never Node's bundled corepack (whose
      # signature keys node 22.13.0 no longer trusts), then a frozen install.
      - uses: ./.github/actions/setup-pnpm-node

      - name: Build the app (no database env — the artifact never touches a database)
        run: env -u DATABASE_URL -u PAYLOAD_SECRET PGHOST=127.0.0.1 PGPORT=1 pnpm build

      # One tarball, one subdir, web/ (DEPLOYMENT.md §3): the standalone server with its
      # `.next/static`/`public` (Next's tracing does not follow files that are only served),
      # sharp and its @img/* binaries beside the server (a native addon no traced module names),
      # and, until TASKS.md 2.2–2.3 move the sites into the app, each brand folder's site/ at
      # <current>/<brand>/site — BRAND picks the one a process serves.
      - name: Assemble web/
        run: bash .github/scripts/assemble-artifact.sh "$RUNNER_TEMP/artifact"

      - name: Package
        id: pack
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          name="production-${stamp}-${sha}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          tar -czf "${name}.tar.gz" -C "$RUNNER_TEMP/artifact" web
          sha256sum "${name}.tar.gz" > "${name}.sha256"
          sha256sum -c "${name}.sha256"
          ls -lh "${name}.tar.gz"
          cat "${name}.sha256"

      - name: Postgres client
        run: sudo apt-get install -y postgresql-client

      - name: db:fresh — the smoke's database (created and migrated)
        run: pnpm db:fresh --brand indies-gallery --suffix "$DB_SUFFIX"

      # The tarball, extracted as a host extracts it, boots web/ on one port and answers both
      # hostnames: home 200 with the brand's name, /admin/login 200, /api/health 200, sharp
      # loading — before anything is published (TASKS.md 4.4.f, 2.1.b).
      - name: Release smoke — web/ boots from the tarball and answers both hosts
        run: bash .github/scripts/smoke-artifact.sh "${{ steps.pack.outputs.name }}.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy
          path: |
            ${{ steps.pack.outputs.name }}.tar.gz
            ${{ steps.pack.outputs.name }}.sha256
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish deploy/production release
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release asset only — this job pushes no ref
    env:
      NAME: ${{ needs.artifact.outputs.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy

      - name: Verify the checksum
        run: sha256sum -c "${NAME}.sha256"

      - name: Publish the release
        run: |
          set -euo pipefail
          gh release create "deploy/${NAME}" \
            --title "${NAME}" \
            --notes "env=production site_type=node branch=${GITHUB_REF_NAME} commit=${GITHUB_SHA}" \
            --target "${GITHUB_SHA}" \
            "${NAME}.tar.gz" \
            "${NAME}.sha256"

      - name: Prune old deploy releases (keep 2 — DEPLOYMENT.md §3)
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("deploy/production-"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            > to-delete.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "pruning $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done < to-delete.txt
